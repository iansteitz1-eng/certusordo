[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certusordo"
version = "0.2.0"
description = "The CertusOrdo doctrine — structured action receipts with hash-chained six-rubric composite scoring for AI agent oversight."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ian Steitz", email = "ian@insynctech.io" },
]
keywords = [
    "ai-safety",
    "agent-oversight",
    "scalable-oversight",
    "audit",
    "alignment",
    "splat",
    "control-monitoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://insynctech.io"
Documentation = "https://github.com/iansteitz1-eng/aria-thesis"
Repository = "https://github.com/iansteitz1-eng/certusordo"
Issues = "https://github.com/iansteitz1-eng/certusordo/issues"
"InsyncTech" = "https://insynctech.io"
"Aria Thesis" = "https://github.com/iansteitz1-eng/aria-thesis"

[tool.setuptools.packages.find]
where = ["."]
include = ["certusordo*"]
exclude = ["tests*", "examples*"]
